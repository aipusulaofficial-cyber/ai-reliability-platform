apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-reliability-platform}
spec:
 replicas: 2
 selector: {matchLabels: {app: ai-reliability-platform}}
 template:
  metadata: {labels: {app: ai-reliability-platform}}
  spec:
   containers:
   - name: api
     image: ai-reliability-platform:latest
     ports: [{containerPort: 8000}]
     readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
     livenessProbe: {httpGet: {path: /health/live, port: 8000}}
